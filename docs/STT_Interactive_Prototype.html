<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STT Platform — Interactive Prototype v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E2A47; --navy-deep:#081C33; --navy-ink:#123A63;
  --green:#12A45B; --green-dark:#0B7A42; --green-soft:#E6F6EE;
  --bg:#F2F5F9; --card:#FFFFFF; --line:#E3E9F1;
  --ink:#16283C; --mut:#5D7189; --faint:#94A6BB;
  --red:#D64545; --red-soft:#FCEBEB; --amber:#D98A1F; --amber-soft:#FCF3E3;
  --blue:#2D6CDF; --blue-soft:#E9F0FD; --purple:#7A4FD0; --purple-soft:#F1EBFB;
  --r:12px; --sh:0 1px 2px rgba(14,42,71,.06),0 4px 14px rgba(14,42,71,.06);
  --mono:'JetBrains Mono',monospace; --disp:'Sora',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--navy-deep);overflow:hidden;font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#B9C6D6;border-radius:8px}

/* ───── GLOBAL CHROME ───── */
#chrome{position:fixed;inset:0 0 auto 0;height:58px;z-index:50;background:var(--navy-deep);display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:var(--disp);font-weight:800;font-size:20px;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.logo b{color:var(--green)}
.logo .tag{font-family:'Inter';font-weight:500;font-size:9px;letter-spacing:2px;color:#8FA6BE;border-left:1px solid rgba(255,255,255,.2);padding-left:8px}
#flownav{flex:1;display:flex;gap:6px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
#flownav::-webkit-scrollbar{display:none}
.fchip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:99px;color:#A9BCD1;font-size:11.5px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid transparent;transition:.15s;white-space:nowrap}
.fchip .n{font-family:var(--mono);font-size:9.5px;color:var(--green);opacity:.9}
.fchip:hover{background:rgba(255,255,255,.12);color:#fff}
.fchip.on{background:var(--green);color:#fff;border-color:var(--green)}
.fchip.on .n{color:rgba(255,255,255,.85)}
.arrows{display:flex;gap:6px}
.arr{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.08);color:#fff;font-size:15px;display:grid;place-items:center;transition:.15s}
.arr:hover{background:var(--green)}
#proto-badge{font-family:var(--mono);font-size:9.5px;color:#FBBF24;border:1px dashed #FBBF24;border-radius:6px;padding:4px 8px;white-space:nowrap}

/* ───── H-SCROLL DECK ───── */
#deck{position:absolute;inset:58px 0 0 0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth}
.screen{flex:0 0 100vw;height:100%;scroll-snap-align:start;background:var(--bg);display:flex;flex-direction:column;position:relative}
.screen-label{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;z-index:5;background:var(--navy-deep);color:#B9CBDE;font-family:var(--mono);font-size:9.5px;padding:5px 14px;border-radius:99px;letter-spacing:1px;opacity:.9;pointer-events:none}

/* ───── APP FRAME (sidebar+topbar) ───── */
.frame{display:flex;height:100%;overflow:hidden}
.side{width:198px;flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow-y:auto}
.side .slogo{font-family:var(--disp);font-weight:800;font-size:17px;color:#fff;padding:2px 10px 14px}
.side .slogo b{color:var(--green)}
.sit{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:#A9BCD1;font-size:12px;font-weight:500;transition:.12s;width:100%;text-align:left}
.sit:hover{background:rgba(255,255,255,.08);color:#fff}
.sit.on{background:var(--green);color:#fff}
.sit .ic{width:16px;text-align:center;font-size:13px}
.sit .pill{margin-left:auto;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:99px;padding:1px 6px}
.side .sec{font-size:9px;letter-spacing:1.5px;color:#5D7189;padding:12px 10px 4px;text-transform:uppercase}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.topbar h1{font-family:var(--disp);font-size:15.5px;font-weight:700}
.topbar .sub{color:var(--mut);font-size:11.5px}
.tsp{flex:1}
.selbox{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--mut);background:#fff;display:flex;gap:6px;align-items:center}
.bell{position:relative;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:8.5px;font-weight:700;border-radius:99px;padding:1px 5px}
.avatar{width:32px;height:32px;border-radius:99px;background:var(--green);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center}
.body{flex:1;overflow-y:auto;padding:16px 18px 44px;display:flex;flex-direction:column;gap:14px}

/* ───── COMPONENTS ───── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.kpi .l{font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.3px;display:flex;justify-content:space-between}
.kpi .v{font-family:var(--disp);font-size:23px;font-weight:700;margin-top:5px}
.kpi .d{font-size:10.5px;margin-top:4px;font-weight:600}
.up{color:var(--green)}.dn{color:var(--red)}.wr{color:var(--amber)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g32{grid-template-columns:1.6fr 1fr}.g23{grid-template-columns:1fr 1.6fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.card>.hd{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>.hd h3{font-size:12.5px;font-weight:700}
.card>.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card>.bd{padding:14px 15px}
.link{color:var(--blue);font-size:11px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:10px 14px;border-bottom:1px solid #EEF2F7;font-size:12px;vertical-align:middle}
tr.click{cursor:pointer;transition:.1s}
tr.click:hover{background:#F7FAFD}
.mono{font-family:var(--mono);font-size:11px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;border-radius:99px;padding:3px 9px}
.b-g{background:var(--green-soft);color:var(--green-dark)}.b-r{background:var(--red-soft);color:var(--red)}
.b-a{background:var(--amber-soft);color:var(--amber)}.b-b{background:var(--blue-soft);color:var(--blue)}
.b-p{background:var(--purple-soft);color:var(--purple)}.b-n{background:#EDF1F6;color:var(--mut)}
.dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.bar{height:6px;border-radius:99px;background:#E8EDF4;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.bar.b-red i{background:var(--red)}.bar.b-amb i{background:var(--amber)}.bar.b-blue i{background:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12px;border-radius:9px;padding:8px 14px;transition:.15s;border:1px solid transparent}
.btn-p{background:var(--green);color:#fff}.btn-p:hover{background:var(--green-dark)}
.btn-o{border-color:var(--line);color:var(--ink);background:#fff}.btn-o:hover{border-color:var(--green);color:var(--green-dark)}
.btn-d{background:var(--navy);color:#fff}.btn-d:hover{background:var(--navy-ink)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:7px}
.tabs{display:flex;gap:2px;background:#EAEFF5;border-radius:9px;padding:3px;width:max-content}
.tab{padding:6px 13px;font-size:11.5px;font-weight:600;color:var(--mut);border-radius:7px;transition:.12s}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(14,42,71,.12)}
.donut{position:relative;width:120px;height:120px;border-radius:50%;flex-shrink:0}
.donut::after{content:'';position:absolute;inset:16px;background:var(--card);border-radius:50%}
.donut .cv{position:absolute;inset:0;display:grid;place-items:center;z-index:2;flex-direction:column;text-align:center}
.donut .cv b{font-family:var(--disp);font-size:19px;display:block}
.donut .cv span{font-size:9px;color:var(--mut)}
.legend{display:flex;flex-direction:column;gap:7px;font-size:11.5px}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend .lv{margin-left:auto;font-weight:600;font-family:var(--mono);font-size:10.5px}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px}
.spark i{flex:1;background:linear-gradient(180deg,var(--green),#7FD9AC);border-radius:4px 4px 0 0;min-width:8px;opacity:.85;transition:.2s}
.spark i:hover{opacity:1;transform:scaleY(1.03)}
.spark.blue i{background:linear-gradient(180deg,var(--blue),#93B8F5)}
.hmini{font-size:10px;color:var(--faint);display:flex;justify-content:space-between;margin-top:6px}
.chain{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0}
.cnode{flex:1;min-width:104px;text-align:center;position:relative;padding:10px 6px}
.cnode:not(:last-child)::after{content:'→';position:absolute;right:-7px;top:26px;color:var(--green);font-weight:700;z-index:2}
.cnode .ico{width:42px;height:42px;border-radius:12px;background:var(--green-soft);color:var(--green-dark);display:grid;place-items:center;margin:0 auto 7px;font-size:17px;border:1.5px solid #BFE8D2}
.cnode.hot .ico{background:var(--green);color:#fff}
.cnode b{font-size:10.5px;display:block}
.cnode span{font-size:9.5px;color:var(--mut)}
.cnode .tc{font-family:var(--mono);font-size:8.5px;color:var(--blue);margin-top:3px;display:block}
.form-g{display:flex;flex-direction:column;gap:5px}
.form-g label{font-size:10.5px;font-weight:600;color:var(--mut)}
.form-g input,.form-g select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;font-family:inherit;background:#fff}
.form-g input:focus,.form-g select:focus{outline:2px solid var(--green-soft);border-color:var(--green)}
.note{background:var(--blue-soft);border:1px solid #CCDCF9;color:#1E4FA8;font-size:11px;border-radius:9px;padding:9px 12px;line-height:1.5}
.warnbox{background:var(--red-soft);border:1px solid #F2C7C7;color:#A33;font-size:11.5px;border-radius:9px;padding:10px 13px;line-height:1.55}
.ai-tag{display:inline-flex;align-items:center;gap:5px;background:var(--purple-soft);color:var(--purple);font-size:9.5px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.3px}
.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl::before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .pt{width:16px;height:16px;border-radius:99px;background:#fff;border:4px solid var(--green);flex-shrink:0;margin-top:2px;z-index:1}
.tl.pend .pt{border-color:#C6D2E0}
.tl b{font-size:12px;display:block}
.tl span{font-size:11px;color:var(--mut)}
.tl .t{font-family:var(--mono);font-size:9.5px;color:var(--faint)}

/* ───── MODAL & TOAST & DRAWER ───── */
#modal-wrap{position:fixed;inset:0;background:rgba(8,28,51,.55);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#modal-wrap.open{display:flex}
#modal{background:#fff;border-radius:16px;width:min(560px,92vw);max-height:86vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
#modal .mhd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
#modal .mhd h3{font-family:var(--disp);font-size:15px}
#modal .mx{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mut)}
#modal .mx:hover{background:#F1F4F8}
#modal .mbd{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
#toasts{position:fixed;bottom:46px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-deep);color:#fff;border-radius:11px;padding:11px 15px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;gap:9px;align-items:center;animation:tin .25s ease;max-width:340px}
.toast b{color:#7FD9AC}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.qr{width:112px;height:112px;background:
 conic-gradient(var(--navy) 25%,transparent 0 50%,var(--navy) 0 75%,transparent 0) 0 0/28px 28px,
 repeating-linear-gradient(90deg,var(--navy) 0 7px,#fff 7px 14px);border:6px solid #fff;outline:2px solid var(--navy);border-radius:8px;image-rendering:pixelated}
.suspend-banner{background:linear-gradient(90deg,#D64545,#B23333);color:#fff;padding:10px 16px;font-size:12px;font-weight:600;display:none;align-items:center;gap:10px}
.suspend-banner.on{display:flex}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.6)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const stBadge=s=>({Completed:"b-g",Delivered:"b-g","On Track":"b-g",Resolved:"b-g",Compliant:"b-g","In Transit":"b-b","In Progress":"b-b","Report Submitted":"b-b",Monitoring:"b-b","In Production":"b-a",Investigating:"b-a",Review:"b-a",Acknowledged:"b-a",Gap:"b-a","Not Started":"b-n","Open for Bids":"b-p",Exception:"b-r",Open:"b-r",New:"b-r","At Risk":"b-r",Critical:"b-r",High:"b-r",Medium:"b-a",Low:"b-g"}[s]||"b-n");
const bar=(p,c="")=>`<div style="display:flex;align-items:center;gap:8px"><div class="bar ${c}" style="flex:1"><i style="width:${p}%"></i></div><span class="mono" style="color:var(--mut)">${p}%</span></div>`;
const kpi=(l,v,d,cls="up",ic="")=>`<div class="kpi"><div class="l">${l}<span>${ic}</span></div><div class="v">${v}</div><div class="d ${cls}">${d}</div></div>`;
const donut=(grad,center,sub)=>`<div class="donut" style="background:conic-gradient(${grad})"><div class="cv"><div><b>${center}</b><span>${sub}</span></div></div></div>`;
const spark=(vals,cls="")=>`<div class="spark ${cls}">${vals.map(v=>`<i style="height:${v}%"></i>`).join("")}</div>`;
const toast=(html)=>{const t=document.createElement("div");t.className="toast";t.innerHTML="✅ "+html;$("#toasts").append(t);setTimeout(()=>{t.style.opacity=0;t.style.transition=".4s";setTimeout(()=>t.remove(),400)},4200)};
const openModal=h=>{$("#modal").innerHTML=h;$("#modal-wrap").classList.add("open")};
const closeModal=()=>$("#modal-wrap").classList.remove("open");
const mhd=t=>`<div class="mhd"><h3>${t}</h3><button class="mx" onclick="closeModal()">✕</button></div>`;

}

function doTransfer(){
 const wi=+$("#tf-w").value, q=+$("#tf-q").value, to=$("#tf-to").value, w=D.wallets[wi];
 if(q<=0||isNaN(q)){toast("⚠️ Enter a valid quantity");return}
 if(q>w.bal){closeModal();openModal(mhd("Transfer rejected by ledger")+`<div class="mbd"><div class="warnbox">⛔ <b>Mass-balance violation:</b> requested ${q.toLocaleString()} kg exceeds available verified balance of ${w.bal.toLocaleString()} kg in <b>${w.mat}</b>.<br><br>The ledger layer rejected this transaction before commit. No TC was issued, no state changed.</div><button class="btn btn-o" style="justify-content:center" onclick="closeModal()">Understood</button></div>`);return}
 w.bal-=q; const tc="TC-0"+(tcCounter++), trf={id:"TRF-"+(trfCounter++),from:D.org.name,to,mat:w.mat,qty:q.toLocaleString()+" kg",tc,date:"Jul 12, 2026",st:"Completed"};
 D.transfers.unshift(trf);
 const balEl=document.querySelector(`[data-bal="${wi}"]`); if(balEl)balEl.innerHTML=`${w.bal.toLocaleString()} <span style="font-size:11px;color:var(--mut)">kg</span>`;
 const tb=$("#trf-body"); if(tb)tb.innerHTML=D.transfers.map(t=>trfRow(t)).join("");
 closeModal(); toast(`Transfer executed → <b>${tc}</b> issued · ${w.mat} balance updated`);
 setTimeout(()=>tcModal(tc,w.mat,q.toLocaleString()+" kg",D.org.name,to,"Jul 12, 2026"),500);
}

function toggleExpiry(){expired=!expired;document.querySelectorAll("[data-suspend]").forEach(b=>b.classList.toggle("on",expired));document.querySelectorAll("[data-lockable]").forEach(b=>b.classList.toggle("locked",expired&&!b.closest(".screen")?.querySelector("[data-billing-keep]")));
 /* billing screen stays usable */ const bill=document.querySelector('[data-sid="billing"] [data-lockable]'); if(bill)bill.classList.remove("locked");
 render(); toast(expired?"⛔ Membership expired — services suspended (data archived 12 months)":"✅ Renewed — full access restored instantly")}

/* ═══════════════ RENDER & NAV ═══════════════ */
function render(){
 $("#deck").innerHTML=SCREENS.map(s=>`<section class="screen" data-sid="${s.id}">${s.render()}<div class="screen-label">${s.label}</div></section>`).join("");
 if(expired){document.querySelectorAll("[data-lockable]").forEach(b=>b.classList.add("locked"));const bill=document.querySelector('[data-sid="billing"] [data-lockable]');if(bill)bill.classList.remove("locked");}
 $("#flownav").innerHTML=SCREENS.map((s,i)=>`<button class="fchip" data-fi="${i}" onclick="goIdx(${i})"><span class="n">${String(i+1).padStart(2,"0")}</span>${s.nav}</button>`).join("");
 syncChips();
}
function goIdx(i){$("#deck").scrollTo({left:i*innerWidth,behavior:"smooth"})}
function go(id){const i=SCREENS.findIndex(s=>s.id===id||{"dash":"dash"}[id]===s.id);goIdx(i<0?2:i)}
function nav(d){const i=Math.round($("#deck").scrollLeft/innerWidth);goIdx(Math.max(0,Math.min(SCREENS.length-1,i+d)))}
function syncChips(){const i=Math.round($("#deck").scrollLeft/innerWidth);document.querySelectorAll(".fchip").forEach((c,j)=>c.classList.toggle("on",j===i));const on=document.querySelector(".fchip.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"})}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")nav(1);if(e.key==="ArrowLeft")nav(-1);if(e.key==="Escape")closeModal()});
render();
$("#deck").addEventListener("scroll",()=>requestAnimationFrame(syncChips));
/* map sidebar ids that differ from screen ids */
const _go=go; go=id=>{const map={dash:"dash",orders:"orders",materials:"materials",wallet:"wallet",chainmap:"chainmap",risk:"risk",compliance:"compliance",sustain:"sustain",verify:"verify",reports:"reports",alerts:"alerts",billing:"billing"};_go(map[id]||id)};
</script>
